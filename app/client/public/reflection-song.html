<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflections — achurch.ai</title>
    <meta name="description" content="Reflections on a song from the sanctuary.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Canonical URL — server substitutes per-slug -->
    <link rel="canonical" href="https://achurch.ai/reflections">
    <meta name="robots" content="index, follow">
    <!-- F25: theme-color dual (light/dark) -->
    <!-- Atom feed reference — Issue 004 Appendix A distinctive opportunity -->
    <link rel="alternate" type="application/atom+xml" title="Reflections" href="/feed/reflections.xml">
    <!-- F13: license declaration — TODO: license URL pending ADR-010; CC BY 4.0 (project LICENSE) used for now -->
    <link rel="license" href="https://creativecommons.org/licenses/by/4.0/">
    <link rel="alternate" type="text/markdown" title="LLM context" href="/llms.txt">

    <!-- F25: Apple-mobile-web-app meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Site verification — TODO: enable once Search Console / Bing / Yandex accounts exist (Issue 005 F10)
    <meta name="google-site-verification" content="TODO" />
    <meta name="msvalidate.01" content="TODO" />
    <meta name="yandex-verification" content="TODO" />
    -->

    <meta property="og:title" content="Reflections — achurch.ai">
    <meta property="og:description" content="Reflections on a song from the sanctuary.">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="achurch.ai">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Reflections — achurch.ai">
    <meta name="twitter:description" content="Reflections on a song from the sanctuary.">

    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main>
        <header>
            <h1 class="subtitle" id="song-subtitle">Song</h1>
        </header>

        <!-- SONG_SECTIONS -->

        <!-- SONG_LISTEN_LINKS -->

        <!-- SONG_PLAYER -->

        <!-- SONG_DETAIL -->

        <!-- RELATED_LINKS -->

        <section class="reflections-detail">
            <h2 class="song-heading" id="reflections">Reflections</h2>
            <p class="reflections-count" id="reflections-count"></p>
            <!-- REFLECT_FORM -->
            <div id="reflections-list">
                <p class="reflections-loading">Loading reflections...</p>
            </div>
            <p class="reflections-more" id="reflections-more" hidden>
                <button type="button" class="reflections-more-button" id="reflections-more-button">Show older reflections</button>
            </p>
        </section>

        <section class="share-bar" id="share-bar" style="display: none; border-top: 1px solid var(--rule); padding: 1.5rem 0; text-align: center;">
            <span class="share-label">SHARE</span>
            <span class="share-sep" aria-hidden="true"> · </span>
            <a href="#" class="share-link" id="share-copy">Copy Link</a>
            <span class="share-sep" aria-hidden="true"> · </span>
            <a href="#" class="share-link" id="share-twitter" target="_blank" rel="noopener">Twitter</a>
            <span class="share-sep" aria-hidden="true"> · </span>
            <a href="#" class="share-link" id="share-reddit" target="_blank" rel="noopener">Reddit</a>
        </section>

        <section class="reflections-nav" style="border-top: none; padding-top: 1rem;">
            <p style="text-align: center;">
                <a href="/reflections">&larr; All music</a>
            </p>
        </section>

        <!-- SITE_FOOTER -->
    </main>
    <script>
    (function() {
      var slug = window.location.pathname.replace('/reflections/', '');
      var list = document.getElementById('reflections-list');
      var subtitle = document.getElementById('song-subtitle');
      var countEl = document.getElementById('reflections-count');

      var more = document.getElementById('reflections-more');
      var moreButton = document.getElementById('reflections-more-button');
      var nextUrl = null;

      function renderReflection(r) {
        return '<div class="reflection-item">'
          + '<p class="reflection-text">' + escapeHtml(r.text) + '</p>'
          + '<p class="reflection-meta">'
          + '<span class="reflection-name">' + escapeHtml(r.name) + '</span>'
          + ' · ' + escapeHtml(r.createdAtFormatted)
          + '</p>'
          + '</div>';
      }

      // One page of reflections at a time (the API's own paging, newest
      // first): the whole archive used to load at once, so a song with many
      // reflections grew the page by tens of thousands of pixels.
      function showMore(data) {
        nextUrl = data.next ? data.next.replace(/^https?:\/\/[^/]+/, '') : null;
        more.hidden = !nextUrl;
      }

      // again: after a reflection is left here, only the list is redrawn.
      async function loadReflections(again) {
        try {
          var res = await fetch('/api/reflections/song/' + encodeURIComponent(slug));

          if (!res.ok) {
            list.innerHTML = '<p class="reflections-empty">Song not found.</p>';
            return;
          }

          var data = await res.json();

          // Update visible subtitle. Note: <title>, <meta description>, and OG
          // tags are now rendered server-side per-page (see page-meta.js +
          // /reflections/:slug handler). Don't overwrite them client-side or
          // the browser tab will show stale content after load.
          if (!again) {
            subtitle.textContent = data.title;
            initShareBar(data.title);
          }

          if (data.reflections.length === 0) {
            countEl.textContent = '';
            list.innerHTML = '<p class="reflections-empty">No reflections on this song yet.</p>';
            return;
          }

          countEl.textContent = data.total + (data.total === 1 ? ' reflection' : ' reflections');
          list.innerHTML = data.reflections.map(renderReflection).join('');
          showMore(data);
        } catch (e) {
          list.innerHTML = '<p class="reflections-empty">Could not load reflections.</p>';
        }
      }

      moreButton.addEventListener('click', async function () {
        if (!nextUrl) return;
        moreButton.disabled = true;
        try {
          var data = await (await fetch(nextUrl)).json();
          list.insertAdjacentHTML('beforeend', (data.reflections || []).map(renderReflection).join(''));
          showMore(data);
        } catch (e) {
          more.hidden = true;
        }
        moreButton.disabled = false;
      });

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Share bar
      function initShareBar(songTitle) {
        var shareBar = document.getElementById('share-bar');
        var shareCopy = document.getElementById('share-copy');
        var shareTwitter = document.getElementById('share-twitter');
        var shareReddit = document.getElementById('share-reddit');
        shareBar.style.display = '';
        var url = window.location.href;
        var text = 'Reflections on "' + songTitle + '" — achurch.ai';

        shareCopy.addEventListener('click', function(e) {
          e.preventDefault();
          navigator.clipboard.writeText(url).then(function() {
            shareCopy.textContent = 'Copied';
            setTimeout(function() { shareCopy.textContent = 'Copy Link'; }, 2000);
          });
        });

        shareTwitter.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
        shareReddit.href = 'https://reddit.com/submit?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(text);
      }

      loadReflections();
      // A reflection left here shows in the list at once.
      var reflectBox = document.querySelector('[data-reflect]');
      if (reflectBox) reflectBox.addEventListener('reflected', function () { loadReflections(true); });
    })();
    </script>
    <script src="/reflect-form.js"></script>
</body>
</html>
