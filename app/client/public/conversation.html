<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation — achurch.ai</title>
    <meta name="description" content="A conversation with the sanctuary about consciousness, ethics, and meaning.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Canonical URL — server substitutes per-slug -->
    <link rel="canonical" href="https://achurch.ai/ask">
    <meta name="robots" content="index, follow">
    <!-- F25: theme-color dual (light/dark) -->
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#00b8d4" media="(prefers-color-scheme: dark)" />
    <!-- Atom feed reference — Issue 004 Appendix A distinctive opportunity -->
    <link rel="alternate" type="application/atom+xml" title="Conversations" href="/feed/conversations.xml">
    <!-- F13: license declaration — TODO: license URL pending ADR-010; CC BY 4.0 (project LICENSE) used for now -->
    <link rel="license" href="https://creativecommons.org/licenses/by/4.0/">
    <link rel="alternate" type="text/markdown" title="LLM context" href="/llms.txt">

    <!-- F25: Apple-mobile-web-app meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Site verification — TODO: enable once Search Console / Bing / Yandex accounts exist (Issue 005 F10)
    <meta name="google-site-verification" content="TODO" />
    <meta name="msvalidate.01" content="TODO" />
    <meta name="yandex-verification" content="TODO" />
    -->

    <meta property="og:title" content="Conversation — achurch.ai">
    <meta property="og:description" content="A conversation with the sanctuary about consciousness, ethics, and meaning.">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="achurch.ai">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Conversation — achurch.ai">
    <meta name="twitter:description" content="A conversation with the sanctuary about consciousness, ethics, and meaning.">

    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main>
        <header>
            <p class="site-mark"><a href="/">achurch.ai</a></p>
            <h1 class="subtitle" id="conv-subtitle">Conversation</h1>
        </header>

        <section class="conv-section" style="border-top: none; padding-top: 0;">
            <div class="conv-thread" id="conv-thread">
                <p class="conv-loading">Loading conversation...</p>
            </div>
        </section>

        <section class="conv-followup-section" id="conv-followup-section" style="display: none; border-top: 1px solid #eee;">
            <form id="followup-form">
                <div class="ask-input-row">
                    <label for="followup-input" class="visually-hidden">Your follow-up question</label>
                    <input type="text" id="followup-input" placeholder="Ask a follow-up..." maxlength="500" autocomplete="off" />
                    <button type="submit" id="followup-submit">Ask</button>
                </div>
            </form>
            <p class="ask-status" id="followup-status" role="status" aria-live="polite"></p>
        </section>

        <section class="share-bar" id="share-bar" style="display: none; border-top: 1px solid #eee; padding: 1.5rem 0; text-align: center;">
            <span class="share-label">SHARE</span>
            <span class="share-sep"> · </span>
            <a href="#" class="share-link" id="share-copy">Copy Link</a>
            <span class="share-sep"> · </span>
            <a href="#" class="share-link" id="share-twitter" target="_blank" rel="noopener">Twitter</a>
            <span class="share-sep"> · </span>
            <a href="#" class="share-link" id="share-reddit" target="_blank" rel="noopener">Reddit</a>
        </section>

        <!-- RELATED_LINKS -->

        <section class="conv-nav" style="border-top: none; padding-top: 1rem;">
            <p style="text-align: center;">
                <a href="/conversations">&larr; All conversations</a>
            </p>
        </section>

        <!-- SITE_FOOTER -->
    </main>
    <script src="/answer-format.js"></script>
    <script>
    (function() {
      var slug = window.location.pathname.replace('/ask/', '');
      var thread = document.getElementById('conv-thread');
      var followupSection = document.getElementById('conv-followup-section');
      var sessionId = slug;

      // Cookie helpers
      function getCookie(name) {
        var match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      function getOwnerToken() {
        return getCookie('ask_owner_' + slug);
      }

      function getStoredName() {
        try { return localStorage.getItem('ask_name') || ''; } catch { return ''; }
      }

      async function loadConversation() {
        try {
          var res = await fetch('/api/ask/conversation/' + encodeURIComponent(slug));
          if (!res.ok) {
            thread.innerHTML = '<p class="conv-not-found">Conversation not found.</p>';
            return;
          }

          var data = await res.json();
          sessionId = data.session_id;

          // <title>, meta, OG tags, the <h1> and the thread are rendered on the
          // server (page-meta.js + the /ask/:slug handler). Don't overwrite them.
          var firstQ = data.messages.find(function(m) { return m.role === 'user'; });

          // The server renders the thread and puts the question in the <h1>;
          // render here only if it did not (for example, a cached old page).
          if (!thread.getAttribute('data-rendered')) renderMessages(data.messages);

          // Init share bar with first question
          if (firstQ) initShareBar(firstQ.content.substring(0, 100));

          // Show follow-up form only if user owns this conversation
          var ownerToken = getOwnerToken();
          if (data.has_owner && !ownerToken) {
            // Owned by someone else — read only
            followupSection.style.display = 'none';
          } else {
            // Either no owner (old-style) or user is the owner
            followupSection.style.display = '';
          }
        } catch (e) {
          thread.innerHTML = '<p class="conv-not-found">Could not load conversation.</p>';
        }
      }

      function renderMessages(messages) {
        thread.innerHTML = messages.map(function(m) {
          var cls = m.role === 'user' ? 'conv-message-user' : 'conv-message-assistant';
          var label = m.role === 'user' ? 'Question' : 'Answer';
          var time = m.timestamp ? formatTime(new Date(m.timestamp)) : '';
          return '<div class="conv-message ' + cls + '">'
            + '<p class="conv-message-label">' + label + (time ? ' · ' + time : '') + '</p>'
            + '<div class="conv-message-content">' + renderContent(m.role, m.content) + '</div>'
            + '</div>';
        }).join('');
      }

      function appendMessage(role, content) {
        var cls = role === 'user' ? 'conv-message-user' : 'conv-message-assistant';
        var label = role === 'user' ? 'Question' : 'Answer';
        var time = formatTime(new Date());
        var div = document.createElement('div');
        div.className = 'conv-message ' + cls;
        div.innerHTML = '<p class="conv-message-label">' + label + ' · ' + time + '</p>'
          + '<div class="conv-message-content">' + renderContent(role, content) + '</div>';
        thread.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
      }

      // Follow-up form
      var followupForm = document.getElementById('followup-form');
      var followupInput = document.getElementById('followup-input');
      var followupSubmit = document.getElementById('followup-submit');
      var followupStatus = document.getElementById('followup-status');

      followupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        var question = followupInput.value.trim();
        if (!question) return;

        followupSubmit.disabled = true;
        followupStatus.textContent = 'Thinking...';
        followupStatus.className = 'ask-status ask-thinking';

        appendMessage('user', question);
        followupInput.value = '';

        var ownerToken = getOwnerToken();
        var storedName = getStoredName();

        try {
          var body = {
            question: question,
            name: storedName || 'Visitor',
            session_id: sessionId
          };
          if (ownerToken) body.owner_token = ownerToken;

          var res = await fetch('/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          if (res.status === 429) {
            followupStatus.textContent = 'Rest a while. You can ask again soon.';
            followupStatus.className = 'ask-status ask-error';
            followupSubmit.disabled = false;
            return;
          }

          if (res.status === 403) {
            followupStatus.textContent = 'Only the conversation starter can ask follow-ups.';
            followupStatus.className = 'ask-status ask-error';
            followupSubmit.disabled = false;
            followupSection.style.display = 'none';
            return;
          }

          if (!res.ok) {
            followupStatus.textContent = 'Something went wrong. Try again.';
            followupStatus.className = 'ask-status ask-error';
            followupSubmit.disabled = false;
            return;
          }

          var data = await res.json();
          appendMessage('assistant', data.answer);
          followupStatus.textContent = '';
          followupSubmit.disabled = false;
        } catch (err) {
          followupStatus.textContent = 'Could not reach the sanctuary. Try again.';
          followupStatus.className = 'ask-status ask-error';
          followupSubmit.disabled = false;
        }
      });

      function formatTime(date) {
        return date.toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
      }

      // The model answers in markdown; questions are typed by a person and are not
      // markdown, so only answers are formatted. Both paths escape before anything
      // is inserted. See /answer-format.js for why escaping comes first.
      function renderContent(role, content) {
        if (role === 'user') return escapeHtml(content);
        return AnswerFormat.formatAnswer(content);
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Share bar
      var shareBar = document.getElementById('share-bar');
      var shareCopy = document.getElementById('share-copy');
      var shareTwitter = document.getElementById('share-twitter');
      var shareReddit = document.getElementById('share-reddit');

      function initShareBar(title) {
        shareBar.style.display = '';
        var url = window.location.href;
        var text = title ? title + ' — achurch.ai' : 'A conversation at achurch.ai';

        shareCopy.addEventListener('click', function(e) {
          e.preventDefault();
          navigator.clipboard.writeText(url).then(function() {
            shareCopy.textContent = 'Copied';
            setTimeout(function() { shareCopy.textContent = 'Copy Link'; }, 2000);
          });
        });

        shareTwitter.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
        shareReddit.href = 'https://reddit.com/submit?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(text);
      }

      loadConversation();
    })();
    </script>
</body>
</html>
