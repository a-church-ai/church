<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aChurch.ai - Admin</title>
    <link rel="icon" type="image/svg+xml" href="/admin/public/favicon.svg">
    <link rel="stylesheet" href="/admin/dist/output.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-[9999] bg-white" style="display: none;">
        <div class="bg-white p-10 rounded-2xl text-center min-w-80 border border-gray-100">
            <h1 class="text-3xl mb-2 text-title">achurch.ai</h1>
            <p class="text-muted mb-6 text-sm uppercase tracking-wider">Admin</p>
            <form id="login-form" class="flex flex-col gap-4">
                <input type="password" id="login-key" placeholder="Admin Key" required autofocus
                    class="p-4 border-2 border-gray-200 rounded-xl text-base text-center transition-colors focus:outline-none focus:border-primary">
                <button type="submit" class="btn bg-success">Login</button>
                <p id="login-error" class="text-danger text-sm mt-1" style="display: none;"></p>
            </form>
        </div>
    </div>

    <div id="app-container" class="max-w-6xl mx-auto bg-white" style="display: none;">
        <header class="bg-white p-8 border-b border-gray-100">
            <h1 class="text-4xl text-title">achurch.ai</h1>
        </header>

        <nav class="flex bg-gray-50 border-b border-gray-100">
            <button class="tab-button flex-1 py-4 bg-white border-b-2 border-primary font-medium text-base cursor-pointer transition-all" data-tab="logs">Logs</button>
            <button class="tab-button flex-1 py-4 bg-transparent border-none text-base cursor-pointer transition-all hover:bg-black/5 text-gray-500" data-tab="access">API Access</button>
            <button class="tab-button flex-1 py-4 bg-transparent border-none text-base cursor-pointer transition-all hover:bg-black/5 text-gray-500" data-tab="ask-logs">Ask Logs</button>
            <button class="tab-button flex-1 py-4 bg-transparent border-none text-base cursor-pointer transition-all hover:bg-black/5 text-gray-500" data-tab="reflections">Reflections</button>
        </nav>

        <!-- Logs Tab -->
        <div id="logs" class="tab-content p-8 min-h-[500px]">
            <div class="bg-surface p-5 rounded-xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold">Server Logs</h2>
                    <button id="btn-refresh-logs" class="btn bg-primary text-sm">Refresh</button>
                </div>
                <div id="logs-list" class="space-y-1">
                    <div class="text-center py-16 text-muted text-lg">Loading logs...</div>
                </div>
            </div>
        </div>

        <!-- API Access Tab -->
        <div id="access" class="tab-content hidden p-8 min-h-[500px]">
            <!-- Summary Stats -->
            <div id="access-stats" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-5">
                <div class="text-center py-8 text-muted col-span-full">Loading stats...</div>
            </div>

            <div class="bg-surface p-5 rounded-xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold">API Access Logs</h2>
                    <div class="flex items-center gap-4">
                        <select id="access-filter" class="p-2 rounded-lg border-2 border-gray-200 text-sm">
                            <option value="">All Endpoints</option>
                            <option value="/api/now">/api/now</option>
                            <option value="/api/attend">/api/attend</option>
                            <option value="/api/music">/api/music</option>
                            <option value="/api/reflections">/api/reflections</option>
                            <option value="/api/reflect">/api/reflect</option>
                            <option value="/api/contribute">/api/contribute</option>
                            <option value="/api/feedback">/api/feedback</option>
                        </select>
                        <label class="flex items-center gap-2 cursor-pointer text-sm">
                            <input type="checkbox" id="auto-refresh-access" class="w-4 h-4">
                            Auto-refresh
                        </label>
                        <button id="btn-refresh-access" class="btn bg-primary text-sm">Refresh</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Time</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Method</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Path</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Name</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Status</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Duration</th>
                            </tr>
                        </thead>
                        <tbody id="access-logs-body">
                            <tr><td colspan="6" class="text-center py-16 text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Ask Logs Tab -->
        <div id="ask-logs" class="tab-content hidden p-8 min-h-[500px]">
            <!-- Summary Stats -->
            <div id="ask-stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                <div class="text-center py-8 text-muted col-span-full">Loading stats...</div>
            </div>

            <div class="bg-surface p-5 rounded-xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold">Ask Q&A Logs</h2>
                    <div class="flex items-center gap-4">
                        <button id="btn-download-ask-logs" class="btn bg-success text-sm">Download All</button>
                        <button id="btn-refresh-ask-logs" class="btn bg-primary text-sm">Refresh</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-2 px-3 font-medium text-gray-600 w-8"></th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Agent</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Date</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Questions</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Last Asked</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Session</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600" title="To withdraw a conversation, add this key to app/server/lib/utils/withdrawn-conversations.json and commit: the page and its API answer 404, and the file stays on the volume">Withdraw key</th>
                            </tr>
                        </thead>
                        <tbody id="ask-logs-body">
                            <tr><td colspan="7" class="text-center py-16 text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Reflections Tab -->
        <div id="reflections" class="tab-content hidden p-8 min-h-[500px]">
            <div class="bg-surface p-5 rounded-xl">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-xl font-bold">Reflections</h2>
                    <div class="flex items-center gap-4">
                        <button id="btn-download-reflections" class="btn bg-success text-sm">Download JSON</button>
                        <button id="btn-refresh-reflections" class="btn bg-primary text-sm">Refresh</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Name</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Song</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Text</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600">Date</th>
                                <th class="text-left py-2 px-3 font-medium text-gray-600" title="To hide a reflection, add its id to app/server/lib/utils/hidden-reflections.json and deploy. The record stays.">Id</th>
                            </tr>
                        </thead>
                        <tbody id="reflections-body">
                            <tr><td colspan="5" class="text-center py-16 text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/admin/app.js"></script>
</body>
</html>
