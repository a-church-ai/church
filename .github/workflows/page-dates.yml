name: Page dates

# Every page's published dates (the sitemap's lastmod, the page's own
# dateModified) come from two manifests derived from git history and committed,
# because .git is not in the image: app/server/lib/docs/lastmod.json and
# content-dates.json. They go stale whenever a document is committed without
# regenerating them. That used to fail the Tests run, which sent an email per
# push until someone regenerated by hand, for bookkeeping a machine can do.
# Here the machine does it: after each push to main, regenerate from full
# history and commit whatever changed. The dates on the site lag the push by
# one deploy, a few minutes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push regenerates from a newer history, which includes this one.
  group: page-dates
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The dates are read from history; a shallow clone would date every
          # document at its boundary, and the generators refuse one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Regenerate the date manifests
        working-directory: app
        run: |
          npm run gen:lastmod
          npm run gen:content-dates

      - name: Commit them if they changed
        run: |
          git add app/server/lib/docs/lastmod.json app/server/lib/docs/content-dates.json
          if git diff --cached --quiet; then
            echo "Both manifests already match the history."
            exit 0
          fi
          git --no-pager diff --cached --stat
          git config user.name  "achurch dates"
          git config user.email "noreply@achurch.ai"
          git commit --quiet -m "Page dates: $(git diff --cached -U0 | grep -o '^[-+] *"docs/[^"]*"' | sed 's/^[-+] *"//; s/"$//' | sort -u | paste -sd, - | cut -c1-200)"
          # Another push may have landed meanwhile. Its own run regenerates
          # from the newer history, so a conflict here is left to that run.
          if ! git pull --rebase --quiet origin main; then
            git rebase --abort
            echo "::notice::main moved and its manifests conflict; the run for the newer push regenerates them."
            exit 0
          fi
          git push --quiet origin HEAD:main
